
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Screen Time</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

.timer{
    font-size:40px;
    text-align:center;
    margin:20px 0;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.start{background:green;color:white;}
.pause{background:orange;color:white;}
.save{background:blue;color:white;}
.clear{background:red;color:white;}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

.session{
    padding:10px;
    border:1px solid #ddd;
    margin-top:8px;
    border-radius:5px;
}

.total{
    font-size:20px;
    font-weight:bold;
    margin-top:20px;
}

/* Owner Details */
.owner{
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid #ddd;
    text-align:center;
    color:#555;
}

.owner h3{
    margin-bottom:8px;
    color:#222;
}

.owner a{
    color:#e1306c;
    text-decoration:none;
    font-weight:bold;
}

.owner a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">

    <h1>📚 Study Screen Time</h1>

    <input type="text" id="subject" placeholder="Enter Subject">

    <div class="timer" id="timer">00:00:00</div>

    <center>
        <button class="start" onclick="startTimer()">Start</button>
        <button class="pause" onclick="pauseTimer()">Pause</button>
        <button class="save" onclick="saveSession()">Save Session</button>
        <button class="clear" onclick="clearData()">Clear</button>
    </center>

    <div class="total" id="totalHours">
        Total Study Time: 0 Hours
    </div>

    <h3>Study Sessions</h3>
    <div id="sessions"></div>

    <!-- Owner Details -->
    <div class="owner">
        <h3>👤 Owner Details</h3>
        <div><b>Owner:</b> Aniket</div>
        <div>
            <b>Instagram:</b>
            <a href="https://www.instagram.com/_urs.aniket" target="_blank">
                @_urs.aniket
            </a>
        </div>
    </div>

</div>

<script>

let seconds = 0;
let interval = null;

let sessions =
JSON.parse(localStorage.getItem("sessions")) || [];

function updateTimer(){

    let hrs = Math.floor(seconds/3600);
    let mins = Math.floor((seconds%3600)/60);
    let secs = seconds%60;

    document.getElementById("timer").innerText =
    String(hrs).padStart(2,'0') + ":" +
    String(mins).padStart(2,'0') + ":" +
    String(secs).padStart(2,'0');
}

function startTimer(){

    if(interval) return;

    interval = setInterval(()=>{
        seconds++;
        updateTimer();
    },1000);
}

function pauseTimer(){

    clearInterval(interval);
    interval = null;
}

function saveSession(){

    let subject =
    document.getElementById("subject").value || "General";

    if(seconds === 0){
        alert("Study for some time first.");
        return;
    }

    const session = {
        subject,
        duration: seconds,
        date: new Date().toLocaleString()
    };

    sessions.push(session);

    localStorage.setItem(
        "sessions",
        JSON.stringify(sessions)
    );

    seconds = 0;
    pauseTimer();
    updateTimer();

    document.getElementById("subject").value = "";

    renderSessions();
}

function renderSessions(){

    const box =
    document.getElementById("sessions");

    box.innerHTML = "";

    let totalSeconds = 0;

    sessions.forEach(s=>{

        totalSeconds += s.duration;

        let div = document.createElement("div");

        div.className = "session";

        div.innerHTML =
        "<b>"+s.subject+"</b><br>" +
        "Time: " +
        (s.duration/60).toFixed(1) +
        " minutes<br>" +
        s.date;

        box.appendChild(div);
    });

    let totalHours =
    (totalSeconds/3600).toFixed(2);

    document.getElementById("totalHours")
    .innerText =
    "Total Study Time: " +
    totalHours +
    " Hours";
}

function clearData(){

    if(confirm("Delete all study records?")){
        localStorage.removeItem("sessions");
        sessions = [];
        renderSessions();
    }
}

updateTimer();
renderSessions();

</script>

</body>
</html>
